<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="rf-token" content="__RF_TOKEN__">
<title>ResearchForge Dashboard</title>
<style>
:root {
  --bg: #0f1117; --panel: #161b27; --panel2: #1a2035; --border: #232c3d; --text: #e2e8f0;
  --muted: #94a3b8; --dim: #64748b; --accent: #60a5fa; --green: #4ade80; --red: #f87171;
  --amber: #fbbf24; --cyan: #22d3ee; --purple: #c084fc; --slate: #475569;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
a { color: var(--accent); text-decoration: none; }
code, .mono { font-family: var(--mono); font-size: 12px; }
code { background: #0b0e14; border: 1px solid var(--border); padding: 0 4px; border-radius: 4px; word-break: break-all; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .5; cursor: progress; }
button.primary { background: #1e3a8a; border-color: #2563eb; }
input[type=text], input[type=number], input[type=password], textarea, select { font: inherit; color: var(--text); background: #0b0e14;
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
input:focus, select:focus { outline: none; border-color: var(--accent); }
.app { display: flex; height: 100vh; }
aside { width: 230px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; }
.brand { padding: 14px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; font-weight: 600; }
.logo { width: 26px; height: 26px; border-radius: 6px; background: #2563eb; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.sel { padding: 10px; border-bottom: 1px solid var(--border); }
.sel select { width: 100%; }
.sel label { display: flex; gap: 6px; align-items: center; color: var(--muted); margin-top: 8px; font-size: 12px; }
nav { padding: 8px; flex: 1; overflow-y: auto; }
.nav { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 6px;
  color: var(--muted); cursor: pointer; user-select: none; }
.nav:hover { background: var(--panel2); color: var(--text); }
.nav.active { background: #1e2f4d; color: var(--accent); }
.nav .count { font-size: 11px; color: var(--dim); }
.foot { padding: 10px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--dim); }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--border); background: #0c0f15; }
header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
header .crumb { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; max-width: 40%; }
header .search { flex: 1 1 220px; min-width: 180px; max-width: 380px; margin-left: auto; }
header .search input { width: 100%; }
.live { display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
.bell { position: relative; padding: 4px 10px; font-size: 14px; line-height: 1; }
.bell .n { position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
.bell .n.old { background: #475569; }
.inbox { position: fixed; top: 52px; right: 16px; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 80px); overflow: auto; z-index: 8; background: #0f141d; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
.inbox .grp { padding: 8px 12px 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.qcard { padding: 10px 12px; border-top: 1px solid var(--border); }
.qhead { display: flex; width: 100%; align-items: baseline; gap: 8px; padding: 8px 12px; border: 0; border-top: 1px solid var(--border); border-radius: 0; background: transparent; text-align: left; cursor: pointer; }
.qhead:hover { background: rgba(255,255,255,.03); }
.qhead .caret { width: 10px; color: var(--muted); }
.qhead .new { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.qcard .q { margin: 2px 0 6px; }
.qcard .new { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-right: 6px; vertical-align: middle; }
#content { flex: 1; overflow-y: auto; padding: 16px 18px 40px; }
.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
.card > .hd, details.card > summary { display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  background: var(--panel2); border-bottom: 1px solid var(--border); border-radius: 8px 8px 0 0; }
details.card > summary { cursor: pointer; list-style: none; }
details.card:not([open]) > summary { border-bottom: 0; border-radius: 8px; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::before { content: "▸"; color: var(--dim); transition: transform .15s; }
details.card[open] > summary::before { transform: rotate(90deg); }
.bd { padding: 10px 12px; }
.title { font-weight: 600; }
.sub { color: var(--muted); font-size: 12px; }
.dim { color: var(--dim); }
.right { margin-left: auto; }
.row { display: flex; gap: 10px; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row > *, .grid > *, .flex > * { min-width: 0; }
.row { overflow-wrap: anywhere; }
.row.click { cursor: pointer; } .row.click:hover { background: var(--panel2); }
.stat { padding: 12px; } .stat .v { font-size: 22px; font-weight: 700; } .stat .l { color: var(--muted); font-size: 12px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.b-green { color: var(--green); border-color: #166534; background: #052e16; }
.b-red { color: var(--red); border-color: #991b1b; background: #450a0a; }
.b-amber { color: var(--amber); border-color: #92400e; background: #422006; }
.b-blue { color: var(--accent); border-color: #1d4ed8; background: #172554; }
.b-cyan { color: var(--cyan); border-color: #155e75; background: #083344; }
.b-purple { color: var(--purple); border-color: #6b21a8; background: #3b0764; }
.b-gray { color: var(--muted); border-color: #334155; background: #1e2635; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.d-green { background: var(--green); } .d-red { background: var(--red); } .d-amber { background: var(--amber); }
.d-gray { background: var(--slate); } .d-blue { background: var(--accent); }
.pulse { animation: pulse 1.4s infinite; } @keyframes pulse { 50% { opacity: .35; } }
.issue { display: flex; gap: 8px; padding: 6px 10px; border-radius: 6px; margin: 6px 0; font-size: 12px; overflow-wrap: anywhere; }
.issue > div { min-width: 0; }
.issue.error { background: #2a0f12; border: 1px solid #7f1d1d; }
.issue.warn { background: #2a1d06; border: 1px solid #78350f; }
.issue.info { background: #0f1a2e; border: 1px solid #1e3a8a; }
.empty { color: var(--muted); padding: 20px; text-align: center; }
.empty b { color: var(--text); }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  padding: 7px 10px; background: var(--panel2); border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel2); }
.trunc { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toggle { position: relative; width: 34px; height: 19px; flex-shrink: 0; display: inline-block; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle span { position: absolute; inset: 0; background: #334155; border-radius: 20px; transition: .2s; cursor: pointer; }
.toggle span::before { content: ""; position: absolute; width: 13px; height: 13px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.toggle input:checked + span { background: #3b82f6; }
.toggle input:checked + span::before { transform: translateX(15px); }
.toggle input:disabled + span { opacity: .5; cursor: progress; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-size: 12px; user-select: none; }
.chip.on { border-color: var(--accent); color: var(--accent); background: #172554; }
pre.log { background: #0b0e14; border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin: 6px 0 0;
  font: 11px/1.4 var(--mono); color: var(--muted); max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
.dag { overflow-x: auto; padding: 6px 0; }
.dag svg text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
.dag .node { cursor: pointer; }
.dag .node:hover rect { stroke-width: 2.5; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: 12px; }
.kv > div:nth-child(odd) { color: var(--muted); }
.toast { position: fixed; right: 16px; bottom: 16px; z-index: 9; display: flex; flex-direction: column; gap: 8px; max-width: 420px; }
.toast div { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; box-shadow: 0 8px 30px #0008; font-size: 12px; white-space: pre-wrap; }
.toast .err { border-color: #7f1d1d; } .toast .ok { border-color: #166534; }
.mb { margin-bottom: 12px; } .mt { margin-top: 12px; }
.sec { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 16px 0 8px; }
.flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@media (max-width: 800px) {
  .app { flex-direction: column; height: auto; min-height: 100vh; }
  aside { width: 100%; border-right: 0; border-bottom: 1px solid var(--border); }
  nav { display: flex; overflow-x: auto; padding: 6px; } .nav { flex-shrink: 0; gap: 6px; }
  .foot { display: none; }
  header { flex-wrap: wrap; } header .search { max-width: none; flex-basis: 100%; }
  #content { padding: 12px 12px 40px; overflow: visible; }
  .trunc { max-width: 180px; }
  .g2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">RF</div>ResearchForge</div>
    <div class="sel">
      <select id="project-select" aria-label="Project filter"></select>
      <label><input type="checkbox" id="show-copies"> Show backups &amp; worktree copies</label>
    </div>
    <nav id="nav"></nav>
    <div class="foot" id="foot">Connecting…</div>
  </aside>
  <main>
    <header>
      <h1 id="view-title">Home</h1>
      <span class="crumb" id="crumb"></span>
      <div class="search"><input type="text" id="search" placeholder="Search everything in this view…" autocomplete="off"></div>
      <button class="bell" id="bell" data-act="bell" aria-label="Questions waiting for you" title="Questions waiting for you">🔔<span class="n" id="bell-n" hidden></span></button>
      <span class="live" id="live"><span class="dot d-gray"></span>Connecting</span>
    </header>
    <div class="inbox" id="inbox" hidden></div>
    <div id="content"><div class="empty">Loading live state…</div></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
let TOKEN = document.querySelector('meta[name="rf-token"]').content;
const VIEWS = [
  ["home", "Home"], ["steer", "Steer"], ["configs", "Run configs"], ["automation", "Automation"], ["runs", "Runs"], ["dag", "DAG"],
  ["hypotheses", "Hypotheses"], ["submissions", "Submissions"], ["timeline", "Timeline"], ["insights", "Insights"],
  ["new", "＋ New competition"], ["keys", "Keys & accounts"],
];
const POLL_MS = 4000, POLL_HIDDEN_MS = 15000;

// ── State ──────────────────────────────────────────────────────────────────
const S = {
  data: null, etag: null, lastOk: 0, fails: 0, pollTimer: null,
  route: { view: "home", p: "all", n: "", q: "" },
  showCopies: lsGet("rf.showCopies") === "1",
  open: new Map(JSON.parse(lsGet("rf.open") || "[]")),
  chips: JSON.parse(lsGet("rf.chips") || "{}"),
  scroll: {}, busy: new Set(), drv: {}, ans: {}, cfg: {}, inboxOpen: false,  // cfg: unsaved Run configs edits
  wiz: {}, cloudGpus: {},  // wiz: unsaved New competition answers, per draft
  qSeen: lsGet("rf.qSeen") || "",  // questions asked after this are marked new
  qOpen: new Set(JSON.parse(lsGet("rf.qOpen") || "[]")),  // question groups opened, per list
   // drv: a driver picked but not saved yet, per project
};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

// ── Routing: the view, project, node and search live in the URL hash, so a
//    reload (or a shared link) restores exactly what you were looking at. ───
function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const [view, qs] = h.split("?");
  const p = new URLSearchParams(qs || "");
  return { view: VIEWS.some(v => v[0] === view) || view.startsWith("plugin/") ? view : "home", p: p.get("p") || "all", n: p.get("n") || "", q: p.get("q") || "" };
}
function hashOf(r) {
  const p = new URLSearchParams();
  if (r.p && r.p !== "all") p.set("p", r.p);
  if (r.n) p.set("n", r.n);
  if (r.q) p.set("q", r.q);
  const qs = p.toString();
  return "#/" + r.view + (qs ? "?" + qs : "");
}
function go(patch, replace) {
  const next = Object.assign({}, S.route, patch);
  if (patch.view && patch.view !== S.route.view && !("n" in patch)) next.n = "";
  const h = hashOf(next);
  if (replace) { history.replaceState(null, "", h); applyRoute(); }
  else if (h !== location.hash) location.hash = h; else applyRoute();
}
function applyRoute() {
  const prevView = S.route.view;
  S.scroll[prevView] = document.getElementById("content").scrollTop;
  S.route = parseHash();
  const s = document.getElementById("search");
  if (document.activeElement !== s) s.value = S.route.q;
  render(prevView !== S.route.view);
}
window.addEventListener("hashchange", applyRoute);

// ── Helpers ────────────────────────────────────────────────────────────────
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ago(ts) {
  if (!ts) return "—";
  const t = new Date(ts).getTime(); if (isNaN(t)) return esc(ts);
  let s = Math.round((Date.now() - t) / 1000); const fut = s < 0; s = Math.abs(s);
  const u = s < 60 ? s + "s" : s < 3600 ? Math.floor(s / 60) + "m" : s < 86400 ? Math.floor(s / 3600) + "h" : Math.floor(s / 86400) + "d";
  return fut ? "in " + u : u + " ago";
}
// Payload timestamps are local-naive ISO strings; compare against local time.
function localNow() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 19); }
const when = ts => ts ? `<span title="${esc(ts)}" data-ts="${esc(ts)}">${ago(ts)}</span>` : '<span class="dim">—</span>';
const DRIVER_NAMES = { claude: "Claude Code", cursor: "Cursor agent", byok: "API key", manual: "manual" };
const fmtTok = n => n >= 1e9 ? (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k" : n.toLocaleString();
const fmtM = v => typeof v === "number" ? (Math.abs(v) >= 1000 ? v.toFixed(1) : v.toFixed(4)) : "—";
const plural = (n, w) => `${n} ${n === 1 ? w : /is$/.test(w) ? w.slice(0, -2) + "es" : w + "s"}`;
function dur(s) { if (!s) return "—"; s = Math.round(s); return s < 60 ? s + "s" : s < 3600 ? Math.round(s / 60) + "m" : (s / 3600).toFixed(1) + "h"; }
function countdown(ts) {
  if (!ts) return "";
  const ms = new Date(ts) - new Date();
  if (isNaN(ms)) return "";
  if (ms <= 0) return "ended " + ago(ts);
  const d = Math.floor(ms / 864e5), hh = Math.floor(ms % 864e5 / 36e5);
  return `${d}d ${hh}h left`;
}
const ACTIVE = ["running", "paused", "waiting", "stalled", "watching", "recent"];
function delta(e) {
  if (typeof e.metric !== "number" || typeof e.baseline !== "number" || !e.baseline) return "";
  const d = e.metric - e.baseline, good = (e.metric_direction || "max").startsWith("max") ? d > 0 : d < 0;
  return `<span class="${good ? "" : "dim"}" style="color:${good ? "var(--green)" : ""}">${d >= 0 ? "+" : ""}${d.toFixed(4)}</span>`;
}
const STATUS = {
  improved: "b-green", complete: "b-gray", failed: "b-red", unscored: "b-purple", on: "b-green", off: "b-gray", running: "b-amber", stale: "b-gray", planned: "b-blue",
  cancelled: "b-gray", tested: "b-gray", untested: "b-cyan", speculative: "b-cyan", approved: "b-green", rejected: "b-red",
  draft: "b-purple", ok: "b-green", error: "b-red", disabled: "b-gray", skipped: "b-gray", never: "b-gray", unknown: "b-amber",
  watching: "b-cyan", recent: "b-blue", idle: "b-gray", worktree: "b-purple", backup: "b-purple", waiting: "b-amber", paused: "b-amber", stalled: "b-red",
  not_installed: "b-gray", installed_not_loaded: "b-amber", failing: "b-red", pending: "b-gray", complete_sub: "b-green",
};
const LABEL = { waiting: "questions for you", complete_sub: "complete", skipped: "waiting", never: "never run", not_installed: "not installed", installed_not_loaded: "not loaded", no_improvement: "no change" };
const badge = (s, extra) => `<span class="badge ${STATUS[s] || "b-gray"}${s === "running" ? " pulse" : ""}"${extra ? ` title="${esc(extra)}"` : ""}>${esc(LABEL[s] || s || "—")}</span>`;
function match(...parts) {
  const q = S.route.q.trim().toLowerCase(); if (!q) return true;
  const hay = parts.map(p => typeof p === "string" ? p : JSON.stringify(p ?? "")).join(" ").toLowerCase();
  return q.split(/\s+/).every(t => hay.includes(t));
}
function isOpen(key, dflt) { return S.open.has(key) ? S.open.get(key) : dflt; }
const det = (key, dflt) => `data-key="${esc(key)}"${isOpen(key, dflt) ? " open" : ""}`;
function issues(list, levels) {
  return (list || []).filter(i => !levels || levels.includes(i.level)).map(i =>
    `<div class="issue ${esc(i.level)}"><span>${i.level === "error" ? "⛔" : i.level === "warn" ? "⚠️" : "ℹ️"}</span><div>${esc(i.message)}${i.hint ? `<div class="dim">${esc(i.hint)}</div>` : ""}</div></div>`).join("");
}
const kindBadges = p => p.kinds.map(k => `<span class="badge ${k === "kaggle" ? "b-blue" : "b-purple"}">${k === "kaggle" ? "kaggle overnight" : "repo project"}</span>`).join(" ");
const shortPath = s => esc(String(s || "").replace(/^\/Users\/[^/]+/, "~"));
function toast(msg, kind) {
  const el = document.createElement("div"); el.className = kind || ""; el.textContent = msg;
  document.getElementById("toast").appendChild(el); setTimeout(() => el.remove(), kind === "err" ? 9000 : 5000);
}

// ── Data selection ─────────────────────────────────────────────────────────
function allProjects() { return S.data ? S.data.projects : []; }
function byId(id) { return allProjects().find(p => p.id === id); }
function projects() {
  const sel = S.route.p;
  if (sel !== "all") { const p = byId(sel); return p ? [p] : []; }
  return allProjects().filter(p => S.showCopies || p.role === "primary");
}
function projectLabel(p) {
  const loc = p.root.replace(/^\/Users\/[^/]+\/Desktop\//, "").replace(/^\/Users\/[^/]+/, "~");
  return `${p.name} — ${loc}`;
}

// ── API ────────────────────────────────────────────────────────────────────
async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-RF-Token": TOKEN }, body: JSON.stringify(body || {}) });
  let j = {}; try { j = await r.json(); } catch (e) { j = { ok: false, error: "invalid response" }; }
  if (!r.ok || !j.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function act(key, fn, okMsg) {
  if (S.busy.has(key)) return;
  S.busy.add(key); render();
  try { const j = await fn(); toast((okMsg || "Done") + (j.output ? "\n" + j.output : ""), "ok"); }
  catch (e) { toast("Failed: " + e.message, "err"); }
  finally { S.busy.delete(key); S.etag = null; await poll(true); render(); }
}

// ── Polling: ETag-conditional GET; only re-render when the payload changed ─
async function poll(once) {
  if (!once) clearTimeout(S.pollTimer);  // a one-off refresh must not cancel the loop
  S.pollStarted = Date.now();
  // A request caught by a server restart can hang forever; never let it stall polling.
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 10000);
  try {
    const r = await fetch("/api/state", { headers: S.etag ? { "If-None-Match": S.etag } : {}, cache: "no-store", signal: ctl.signal });
    if (r.status === 200) {
      const data = await r.json();
      TOKEN = r.headers.get("X-RF-Token") || TOKEN;
      // A restarted (possibly upgraded) server: reload the shell; the hash keeps our place.
      if (S.serverStart && data.server && data.server.started_at !== S.serverStart) { location.reload(); return; }
      S.serverStart = data.server && data.server.started_at;
      S.data = data; S.etag = r.headers.get("ETag"); render();
    }
    else if (r.status !== 304) throw new Error("HTTP " + r.status);
    S.lastOk = Date.now(); S.fails = 0;
  } catch (e) { S.fails++; }
  finally { clearTimeout(timer); }
  tick();
  if (!once) S.pollTimer = setTimeout(poll, document.hidden ? POLL_HIDDEN_MS : POLL_MS);
}
// Watchdog: restart the loop if no poll has started for a while (e.g. timers throttled).
setInterval(() => { if (S.pollStarted && Date.now() - S.pollStarted > POLL_HIDDEN_MS + 12000) poll(); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
function tick() {
  const live = document.getElementById("live");
  const age = S.lastOk ? Math.round((Date.now() - S.lastOk) / 1000) : null;
  if (!S.lastOk) live.innerHTML = `<span class="dot d-gray"></span>Connecting`;
  else if (S.fails >= 3) live.innerHTML = `<span class="dot d-red"></span><span style="color:var(--red)">Offline — last update ${age}s ago</span>`;
  else if (S.fails) live.innerHTML = `<span class="dot d-amber pulse"></span><span style="color:var(--amber)">Reconnecting…</span>`;
  else live.innerHTML = `<span class="dot d-green pulse"></span><span style="color:var(--green)">Live</span><span class="dim">· ${age}s</span>`;
  document.querySelectorAll("[data-ts]").forEach(el => { el.textContent = ago(el.dataset.ts); });
  if (S.data) document.getElementById("foot").innerHTML =
    `Data changed ${ago(S.data.generated_at)} (built in ${S.data.build_ms}ms)<br>${plural(S.data.totals.projects, "project")} · ${S.data.discovery.scan_roots.length} scan roots${(S.data.discovery.hidden_roots || []).length ? ` · ${S.data.discovery.hidden_roots.length} hidden` : ""}<br>Polling every ${POLL_MS / 1000}s`;
}
setInterval(tick, 1000);

// ── DAG ────────────────────────────────────────────────────────────────────
const NODE = { w: 210, h: 58, gx: 56, gy: 14 }, MAX_MERGE_EDGES = 8;

function layout(exps) {

    <text x="${rx + 10}" y="${ry + 20}" fill="#e2e8f0" font-size="12" font-weight="700">Baseline</text>
    <text x="${rx + 10}" y="${ry + 38}" fill="#94a3b8" font-size="11">${bl ? "metric " + fmtM(bl.baseline) : "no baseline metric recorded"}</text>

      <rect x="${x}" y="${y}" width="${NODE.w}" height="${NODE.h}" rx="8" fill="${fill}" stroke="${on ? "#f8fafc" : stroke}" stroke-width="${on ? 2.5 : 1.5}"${e.status === "stale" ? ' stroke-dasharray="4 3"' : e.imported ? ' stroke-dasharray="2 3"' : ""}${e.status === "running" ? ' class="pulse"' : ""}/>
      <text x="${x + 10}" y="${y + 17}" fill="#fff" font-size="12" font-weight="700">${esc(e.id)}${isBest ? " ★" : ""}${e.is_merge ? " ⑂" : ""}${steer ? " 🧭" : ""}</text>
      <text x="${x + NODE.w - 10}" y="${y + 17}" fill="${mc}" font-size="12" font-weight="600" text-anchor="end">${fmtM(e.metric)}</text>
      <text x="${x + 10}" y="${y + 34}" fill="#cbd5e1" font-size="11">${esc(t)}</text>
      <text x="${x + 10}" y="${y + 50}" fill="#64748b" font-size="10">${esc(e.status)}${e.stage ? " · " + esc(e.stage) : ""}${e.branch ? " · " + esc(e.branch.slice(0, 14)) : ""}</text></g>`;
  });

  if (open) shown.forEach(({ p, exps }) => {
    const t = ts => new Date(ts).getTime(), now = Date.now();
    const end = e => e.completed_at ? t(e.completed_at) : e.status === "running" ? now : t(e.started_at) + (e.duration_s || 0) * 1000;
    const lo = Math.min(...exps.map(e => t(e.started_at))), hi = Math.max(lo + 60000, ...exps.map(end));
    const W = 760, L = 150, rowH = 16, x = v => L + (v - lo) / (hi - lo) * (W - L - 10);
    const bars = exps.map((e, i) => {
      const [, stroke] = nodeColors(e, p.best && p.best.id === e.id), x1 = x(t(e.started_at)), x2 = Math.max(x1 + 3, x(end(e)));
      return `<g class="click" data-act="link" data-href="${esc(hashOf({ view: "dag", p: p.id, n: e.id }))}"><title>${esc(`${e.id}: ${e.title}\n${e.started_at} → ${e.completed_at || (e.status === "running" ? "running" : "no end recorded")} (${dur(e.duration_s)})`)}</title>
        <text x="0" y="${i * rowH + 12}" fill="#94a3b8" font-size="10">${esc((e.id + " " + e.title).slice(0, 26))}</text>
        <rect x="${x1}" y="${i * rowH + 3}" width="${x2 - x1}" height="${rowH - 6}" rx="2" fill="${stroke}"${e.completed_at || e.status === "running" ? "" : ' fill-opacity="0.45"'}/></g>`;
    }).join("");
    h += `<div class="sub mt">${esc(p.name)} · ${esc(exps[0].started_at.slice(0, 16).replace("T", " "))} → ${esc(new Date(hi - new Date(hi).getTimezoneOffset() * 60000).toISOString().slice(0, 16).replace("T", " "))}</div>
      <div class="dag"><svg width="${W}" height="${exps.length * rowH + 4}" xmlns="http://www.w3.org/2000/svg">${bars}</svg></div>`;
  });
  return h + `</div></details>`;
}

// ── Insights ───────────────────────────────────────────────────────────────
function spark(p) {
  const pts = p.experiments.filter(e => typeof e.metric === "number" && e.status !== "failed" && !e.imported).sort((a, b) => (a.started_at || "").localeCompare(b.started_at || ""));
  if (pts.length < 2) return '<span class="dim">—</span>';
  const vals = pts.map(e => e.metric), bl = pts[0].baseline;
  const all = typeof bl === "number" ? vals.concat([bl]) : vals;
  const lo = Math.min(...all), hi = Math.max(...all), W = 200, H = 40, sx = i => i / (pts.length - 1) * (W - 4) + 2, sy = v => hi === lo ? H / 2 : H - 3 - (v - lo) / (hi - lo) * (H - 6);
  return `<svg width="${W}" height="${H}"><title>${pts.length} metrics ${fmtM(lo)}–${fmtM(hi)}</title>${typeof bl === "number" ? `<line x1="0" x2="${W}" y1="${sy(bl)}" y2="${sy(bl)}" stroke="#64748b" stroke-dasharray="3 3"/>` : ""}
    <polyline fill="none" stroke="#60a5fa" stroke-width="1.5" points="${pts.map((e, i) => sx(i) + "," + sy(e.metric)).join(" ")}"/>${pts.map((e, i) => `<circle cx="${sx(i)}" cy="${sy(e.metric)}" r="2" fill="${e.status === "improved" ? "#4ade80" : "#94a3b8"}"/>`).join("")}</svg>`;
}
// Which way this project's metric improves, and a warning when setup only guessed it.
function dirTag(p) {
  const c = p.overnight && p.overnight.competition;
  const d = (c && c.direction) || (p.experiments[0] && p.experiments[0].metric_direction);
  if (!d) return "";
  const src = (c && c.direction_source) || "", unsure = !!c && (src === "guess" || !src);
  const from = { leaderboard: "from the leaderboard order", ai: "read from the evaluation text", keyword: "from the metric name", user: "set by you" };
  const fix = `researchforge kaggle settings ${p.slug} --metric-direction ${d.startsWith("max") ? "minimize" : "maximize"}`;
  const tip = unsure ? `${src ? "Setup guessed this" : "Setup did not record how it knew this"}. If it is wrong: ${fix}` : `Direction ${from[src] || "from setup"}`;
  return `<div class="dim" style="font-size:11px${unsure ? ";color:var(--amber)" : ""}" title="${esc(tip)}">${d.startsWith("max") ? "↑ higher is better" : "↓ lower is better"}${unsure ? (src ? " (guessed)" : " (unchecked)") : ""}</div>`;
}
function vInsights() {
  const ps = projects().filter(p => p.role === "primary" || S.route.p !== "all");
  const exps = ps.flatMap(p => p.experiments), imp = exps.filter(e => e.status === "improved").length, fail = exps.filter(e => e.status === "failed").length;
  const hyps = ps.flatMap(p => p.hypotheses), tested = hyps.filter(h => h.tested).length;
  const tok = ps.reduce((a, p) => ({ i: a.i + p.tokens.input_tokens, o: a.o + p.tokens.output_tokens, r: a.r + (p.tokens.cache_read_tokens || 0), c: a.c + (p.tokens.estimated_cost_usd || 0), rc: a.rc + (p.tokens.reported_cost_usd || 0), n: a.n + p.tokens.calls }), { i: 0, o: 0, r: 0, c: 0, rc: 0, n: 0 });
  const tiles = [["Experiments", exps.length, "var(--accent)"], ["Improved", imp, "var(--green)"], ["Improvement rate", exps.length ? Math.round(imp / exps.length * 100) + "%" : "—", "var(--green)"],
    ["Failed", fail, "var(--red)"], ["Hypotheses tested", `${tested}/${hyps.length}`, "var(--purple)"], ["Tokens in / out", tok.i + tok.o ? `${fmtTok(tok.i)} <span class="dim">/</span> ${fmtTok(tok.o)}` : "0", "var(--amber)"]];
  let h = `<div class="grid g4 mb">${tiles.map(([l, v, c]) => `<div class="card stat"><div class="v" style="color:${c}">${v}</div><div class="l">${l}</div></div>`).join("")}</div>`;
  h += `<div class="card mb"><div class="tbl"><table><thead><tr><th>Project</th><th>Runs</th><th>Improved</th><th>Rate</th><th>Baseline</th><th>Best</th><th>Metric progression</th></tr></thead><tbody>${ps.filter(p => p.experiments.length && match(p.name)).map(p => {
    const e = p.experiments, i = e.filter(x => x.status === "improved").length, bl = e.find(x => typeof x.baseline === "number");
    return `<tr class="click" data-act="link" data-href="${esc(hashOf({ view: "dag", p: p.id }))}"><td>${esc(p.name)}<div class="dim mono trunc">${shortPath(p.location)}</div></td><td>${e.length}</td><td style="color:var(--green)">${i}</td><td>${Math.round(i / e.length * 100)}%</td>
      <td class="mono">${bl ? fmtM(bl.baseline) : "—"}</td><td class="mono" style="color:var(--accent)">${p.best ? fmtM(p.best.metric) : "—"}${dirTag(p)}</td><td>${spark(p)}</td></tr>`; }).join("") || `<tr><td colspan="7" class="empty">No experiments yet.</td></tr>`}</tbody></table></div></div>`;
  // Tokens
  h += `<div class="sec">Token usage</div><div class="card"><div class="bd">`;
  const withTok = ps.filter(p => p.tokens.calls);
  h += tok.n ? `<div class="sub mb">${tok.n} metered calls · <b>${tok.i.toLocaleString()}</b> input tokens (what the model read, ${tok.r.toLocaleString()} of them from cache) · <b>${tok.o.toLocaleString()}</b> output tokens (what it wrote) · <b>$${tok.c.toFixed(2)}</b>${tok.rc ? ` ($${tok.rc.toFixed(2)} as reported by Claude Code, the API-equivalent price; on a subscription it counts toward your plan's limits rather than being billed)` : ""}${tok.c - tok.rc > 0.005 ? `, the rest estimated at list prices (override in <code>~/.config/researchforge/dashboard.json</code> → <code>token_prices</code>)` : ""}</div>` :
    `<div class="sub mb">No metered model calls recorded yet. Direct API calls are logged to <code>.overnight_&lt;slug&gt;/token_usage.jsonl</code> and the project DB's <code>ai_calls</code> table.</div>`;
  if (withTok.length) h += `<div class="tbl"><table><thead><tr><th>Project</th><th>Model</th><th>Calls</th><th title="Prompt tokens the model read, cached ones included">Input</th><th title="Input tokens served from the prompt cache (cheaper)">of which cached</th><th title="Tokens the model wrote">Output</th><th>Cost</th><th>Tokens by purpose</th></tr></thead><tbody>${withTok.flatMap(p => Object.entries(p.tokens.by_model).map(([m, v]) =>
    `<tr><td>${esc(p.name)}</td><td class="mono">${esc(m)}</td><td>${v.calls}</td><td>${v.input.toLocaleString()}</td><td class="dim">${(v.cache_read || 0).toLocaleString()}</td><td>${v.output.toLocaleString()}</td><td class="mono">${v.cost_usd ? "$" + v.cost_usd.toFixed(2) : "—"}</td><td class="sub">${Object.entries(p.tokens.by_purpose).map(([k, n]) => `${esc(k)}: ${n.toLocaleString()}`).join(" · ")}</td></tr>`)).join("")}</tbody></table></div>`;
  const perRound = withTok.filter(p => Object.keys(p.tokens.by_round || {}).length);
  if (perRound.length) h += `<div class="sec">Proposal tokens per round</div><div class="tbl"><table><thead><tr><th>Project</th><th>Rounds</th></tr></thead><tbody>${perRound.map(p =>
    `<tr><td>${esc(p.name)}</td><td class="sub">${Object.entries(p.tokens.by_round).map(([r, n]) => `<a href="${hashOf({ view: "dag", p: p.id, n: r })}">${esc(r)}</a>: ${n.toLocaleString()}`).join(" · ")}</td></tr>`).join("")}</tbody></table></div>`;
  const unobs = ps.filter(p => p.tokens.unobservable);
  if (unobs.length) h += issues([{ level: "info", message: `${unobs.map(p => p.name).join(", ")}: rounds you run from your own Claude Code chat are not metered`, hint: unobs[0].tokens.note }]);
  h += `</div></div>`;
  return h;
}

      delete S.ans["key:" + name];
      if (!r.test.ok) throw new Error(`saved, but the test failed: ${r.test.detail}`);
      return { output: r.test.detail };
    }), "Saved and tested");
  }
  else if (a === "key-test") {
    const name = el.dataset.name;
    act("key:" + name, () => api("/api/keys/test", { name }).then(r => { if (!r.test.ok) throw new Error(r.test.detail); return { output: r.test.detail }; }), "Test passed");
  }
  else if (a === "key-remove") {
    const name = el.dataset.name;
    if (confirm(`Remove the ${name} key from this machine?\n\nUnattended runs that use it stop working until you set it again.`)) act("key:" + name, () => api("/api/keys/remove", { name }), "Removed");
  }
  else if (a === "key-colab") {
    const op = el.dataset.op;
    if (op === "install" && !confirm("Install Google's Colab CLI on this machine?\n\nRuns: uv tool install google-colab-cli")) return;
    const body = { op };
    if (op === "code") { body.code = S.ans["colab-code"] || ""; if (!body.code.trim()) { toast("Paste the code Google showed", "err"); return; } }
    act("colab", () => api("/api/keys/colab", body).then(r => {
      if (op === "signin") { S.colabUrl = r.url || null; if (r.url) window.open(r.url, "_blank", "noopener"); }
      if (op === "code" || op === "cancel") { S.colabUrl = null; delete S.ans["colab-code"]; }
      return r;
    }), { install: "Colab CLI installed — now sign in", signin: "Google's sign-in opened in a new tab", code: "Signed in to Colab", cancel: "Sign-in cancelled" }[op]);
  }
  else if (a === "new-facts" || a === "new-refacts") {
    const competition = a === "new-facts" ? (S.ans["new:competition"] || "").trim() : el.dataset.slug;
    const root = a === "new-facts" ? (S.ans["new:root"] || "").trim() : el.dataset.art.replace(/\/[^/]+$/, "");
    if (!competition) { toast("Paste the competition URL first", "err"); return; }
    act("new", () => api("/api/new/facts", { competition, root }).then(r => { delete S.ans["new:competition"]; delete S.ans["new:root"]; return r; }), "Gathering facts — the questions appear below when it finishes");
  }
  else if (a === "new-gpus") {
    const art = el.dataset.art, provider = (S.wiz[art].cloud || {}).provider || "runpod";
    act("gpus", () => api("/api/new/cloud-gpus", { provider }).then(r => { S.cloudGpus[provider] = r.gpus; return { output: `${r.gpus.length} GPU types` }; }), `GPUs on ${provider}`);
  }
  else if (a === "new-save") act("new:" + el.dataset.art, () => api("/api/new/draft", { artifacts_dir: el.dataset.art, form: S.wiz[el.dataset.art] }), "Saved — finish it here or with /overnight in Claude Code or Cursor");
  else if (a === "new-setup") {
    const art = el.dataset.art, w = S.wiz[art];
    if (!confirm(`Set up this competition now?\n\nRuns setup in ${art.replace(/\/[^/]+$/, "")}: compute, the baseline (it can take a while), sensors${w.sensors && w.sensors.auto_run_sensor ? ", auto-run" : ""}${w.scheduler && w.scheduler.on ? " and the background service" : ""}.\nNothing is submitted to Kaggle.`)) return;
    act("new:" + art, () => api("/api/new/setup", { artifacts_dir: art, form: w }), "Setup started — progress shows on this card");
  }
  else if (a === "new-discard") {
    const art = el.dataset.art;
    if (confirm(`Discard this setup draft?\n\nYour answers are deleted; the facts already gathered in ${art} stay.`)) act("new:" + art, () => api("/api/new/discard", { artifacts_dir: art }).then(r => { delete S.wiz[art]; return r; }), "Draft discarded");
  }
  else if (a === "steer-add" && p) {
    const text = (S.ans["steer:" + id] || "").trim(), [kind, rounds] = document.getElementById("steer-kind-" + id).value.split(":");
    if (!text) { toast("Write the direction first", "err"); return; }
    act("steer:" + id, () => api("/api/steer", { project: id, op: "add", text, kind, rounds: +rounds }).then(r => { delete S.ans["steer:" + id]; return r; }),
      kind === "standing" ? "Direction added — every round follows it until you remove it" : "Direction added at the top of Up next — the next round must follow it or say why not");
  }
  else if (a === "q-move" && p) {
    const q = el.dataset.q, i = +el.dataset.i, delta = +el.dataset.delta, ids = qOrder(q, p);
    if (q === "engine") act("steer:" + id, () => api("/api/steer", { project: id, op: "pin", id: el.dataset.qid }), "Pinned — it now goes before the engine's other ideas");
    else if (q === "pins" && delta > 0 && i === ids.length - 1) act("steer:" + id, () => api("/api/steer", { project: id, op: "unpin", id: el.dataset.qid }), "Unpinned — back in the engine's ranking");
    else { const moved = qMove(ids, i, delta); if (moved) qSave(q, p, moved); }
  }
  else if (a === "pin" && p) {
    const op = el.dataset.op;
    act("steer:" + id, () => api("/api/steer", { project: id, op, id: el.dataset.pin }), op === "pin" ? "Pinned — it goes before the engine's ranking" : "Unpinned");
  }
  else if (a === "steer-remove" && p) act("steer:" + id, () => api("/api/steer", { project: id, op: "remove", id: el.dataset.d }), "Direction removed");
  else if (a === "steer-old" && p) { e.preventDefault(); S.open.set("steerold:" + id, !S.open.get("steerold:" + id)); render(); }
  else if (a === "loop" && p) {
    const op = el.dataset.op, body = { project: id, op };
    if (op === "pause") { const why = prompt(`Pause ${p.name}? A round already running finishes; no new one starts.\n\nWhy (optional, shown here):`); if (why === null) return; body.text = why; }
    if (op === "resynthesize" && !confirm(`Re-synthesize ${p.name} now?\n\nThe idea pool is rebuilt from the results so far, with the project's driver. It can take a few minutes.`)) return;
    if (op === "add-idea") { body.text = (S.ans["idea:" + id] || "").trim(); if (!body.text) { toast("Write the idea first", "err"); return; } }
    act("loop:" + id, () => api("/api/loop", body).then(r => { if (op === "add-idea") delete S.ans["idea:" + id]; return r; }),
      { pause: "Paused", resume: "Resumed", resynthesize: "Re-synthesized", "add-idea": "Idea added — the next prepare-round sees it first" }[op]);
  }
  else if (a === "sched" && p) schedule(p, el.dataset.on === "1");
});
document.addEventListener("change", e => {
  const el = e.target, a = el.dataset && el.dataset.act, id = el.dataset && el.dataset.id, p = id && byId(id);
  if (a === "sched-toggle" && p) { const want = el.checked; el.checked = !want; schedule(p, want); }
  else if (a === "ra-service" && p) {
    const want = el.checked, sv = p.repo.auto_run.service; el.checked = !want;
    if (!confirm(want ? `Install the background service ${sv.label}?\n\nIt runs a monitor cycle for ${p.root} every ${p.repo.auto_run.config.poll_minutes} min, also with the dashboard closed.` : `Remove the background service ${sv.label}? Launches stop starting by themselves.`)) return;
    act("ra-service:" + id, () => api("/api/repo/auto", { project: id, op: "service", enabled: want }), want ? "Service installed" : "Service removed");
  }
  else if (a === "ra-enabled" && p) { const want = el.checked; el.checked = !want; act("ra-settings:" + id, () => api("/api/repo/auto", { project: id, op: "settings", changes: { enabled: want } }), want ? (p.repo.auto_run.service.installed ? "Auto-run on" : "Auto-run on — install the background service so it runs by itself") : "Auto-run off"); }
  else if (a === "drv-pick" && p) { S.drv[id] = el.value; render(); }
  else if (el.dataset && el.dataset.wiz && S.wiz[el.dataset.art]) {  // a choice that changes which questions show
    if (el.type === "radio" && !el.checked) return;
    wset(S.wiz[el.dataset.art], el.dataset.wiz, el.type === "checkbox" ? el.checked : el.value);
    if (el.tagName === "SELECT" || el.type === "checkbox" || el.type === "radio") { el.blur(); render(); }
  }
  else if (a === "sensor-toggle" && p) { const want = el.checked; el.checked = !want; act(`sensor:${id}:${el.dataset.name}`, () => api("/api/sensor", { project: id, name: el.dataset.name, enabled: want }), `${el.dataset.name} ${want ? "enabled" : "disabled"}`); }
});
function schedule(p, enable) {
  const hours = +((document.getElementById("int-" + p.id) || {}).value || 6);
  const s = p.scheduler;
  const msg = enable
    ? `Install launchd job ${s.label}?\n\nRuns \`researchforge kaggle scheduler-install ${p.slug} --interval-hours ${hours}\` for\n${p.location}` + (s.installed && !s.targets_this_dir ? `\n\nThis REPLACES the existing job that writes to ${s.target_dir}.` : "")
    : `Remove launchd job ${s.label}?\n\nRuns \`researchforge kaggle scheduler-uninstall ${p.slug}\`. Background sensors stop until reinstalled.`;
  if (!confirm(msg)) return;
  act("sched:" + p.id, () => api("/api/scheduler", { project: p.id, enabled: enable, interval_hours: hours }), enable ? "Scheduler installed" : "Scheduler removed");
}
document.getElementById("project-select").addEventListener("change", e => go({ p: e.target.value, n: "" }));
document.getElementById("show-copies").addEventListener("change", e => { S.showCopies = e.target.checked; lsSet("rf.showCopies", S.showCopies ? "1" : "0"); render(); });
let qTimer;
document.getElementById("search").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => go({ q: e.target.value }, true), 150); });
document.addEventListener("focusout", e => { if (S.renderPending && e.target.closest && e.target.closest("#content")) setTimeout(() => { if (S.renderPending) render(); }, 0); });
document.addEventListener("input", e => {
  const ds = e.target.dataset || {};
  if (ds.ans) S.ans[ds.ans] = e.target.value;
  if (ds.wiz && S.wiz[ds.art] && e.target.type !== "checkbox" && e.target.type !== "radio" && e.target.tagName !== "SELECT") wset(S.wiz[ds.art], ds.wiz, e.target.value);
  if (ds.cfg) {  // unsaved Run configs edit: kept across refreshes until saved or discarded
    const b = S.cfg[ds.pid] = S.cfg[ds.pid] || {};
    if (String(e.target.value) === String(ds.orig)) delete b[ds.cfg]; else b[ds.cfg] = e.target.value;
    if (!Object.keys(b).length) delete S.cfg[ds.pid];
  }
});
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); document.getElementById("search").focus(); } });

S.route = parseHash();
document.getElementById("search").value = S.route.q;
if (!location.hash) history.replaceState(null, "", hashOf(S.route));
renderChrome();
poll();
</script>
</body>
